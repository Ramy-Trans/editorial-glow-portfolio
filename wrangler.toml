# wrangler.toml — Cloudflare Pages configuration
# Used by `wrangler pages dev` for local Cloudflare preview.
# The Cloudflare Pages dashboard build settings must also match:
#   Build command:       npm install && npm run build
#   Build output dir:    .output/public
#   Environment variable: CF_PAGES=1  (triggers NITRO_PRESET=cloudflare-pages)

name = "gj-media-house"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".output/public"

# ── Environment variables ─────────────────────────────────────
# Non-secret values can go here. Secrets must be set in the
# Cloudflare Pages dashboard → Settings → Environment Variables
# (or via `wrangler pages secret put VAR_NAME`).
[vars]
NODE_ENV = "production"

# ── Required secrets (set in Cloudflare dashboard, NOT here) ──
# ADMIN_PASSWORD        — password to log in at /dashboard
# ADMIN_SECRET          — HMAC signing key for admin tokens
# SUPABASE_URL          — https://xxx.supabase.co
# SUPABASE_SERVICE_ROLE_KEY — service role key (not anon key)
