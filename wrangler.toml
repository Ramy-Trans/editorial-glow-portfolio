# wrangler.toml — Cloudflare Pages configuration
#
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: This is a PAGES project, not a Workers project.
#
# In the Cloudflare Pages dashboard → Settings → Build & deployments:
#   Build command:        npm install && npm run build
#   Build output dir:     .output/public          ← CF Pages serves this folder
#   Deploy command:       npx wrangler pages deploy .output/public --project-name editorial-glow-portfolio
#   Environment variable: CF_PAGES=1              ← add this so the build uses the CF preset
#
# DO NOT use `wrangler deploy` (no "pages" subcommand) — that is the Workers
# deploy command.  It ignores pages_build_output_dir, re-bundles the server
# entry as a legacy IIFE Worker, and fails with top-level-await errors.
#
# DO NOT add a `main` field — that also switches Wrangler into Workers mode.
# DO NOT use `wrangler versions upload` — that is for Workers versioning.
# ─────────────────────────────────────────────────────────────────────────────

name = "editorial-glow-portfolio"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages reads this field and serves the contents of .output/public.
# The build script (scripts/build-output.js) places _worker.js + all static
# assets here when CF_PAGES=1 is set in the build environment.
pages_build_output_dir = ".output/public"

# ── Non-secret environment variables ─────────────────────────────────────────
[vars]
NODE_ENV = "production"

# ── Required secrets (set in CF Pages dashboard → Settings → Environment Variables)
# ADMIN_PASSWORD            — password to log in at /dashboard
# ADMIN_SECRET              — HMAC signing key for admin tokens
# SUPABASE_URL              — https://xxx.supabase.co
# SUPABASE_SERVICE_ROLE_KEY — service role key (not the anon key)
